<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">LiveAvatar Sandbox Gateway Flow</title>
  <desc id="desc">Browser-first sequence diagram for LiveAvatar sandbox gateway flow with URL token access and optional Ed25519 signature authorization.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .gateway { fill: #f8fbff; stroke: #93c5fd; stroke-width: 2; filter: url(#shadow); }
      .auth { fill: #eef6ff; stroke: #bfdbfe; stroke-width: 1.5; filter: url(#shadow); }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .step { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 9 9; marker-end: url(#arrow-muted); }
      .life { fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="980" />
  <text class="title" x="72" y="62">LiveAvatar Sandbox Gateway Flow</text>

  <rect class="card" x="78" y="116" width="260" height="108" rx="8" />
  <text class="label" x="124" y="164">用户浏览器 / 域名</text>
  <text class="text" x="124" y="194">用户第一入口</text>

  <rect class="gateway" x="460" y="116" width="280" height="108" rx="8" />
  <text class="label" x="520" y="164">LiveAvatar Gateway</text>
  <text class="text" x="520" y="194">创建、鉴权、代理</text>

  <rect class="auth" x="832" y="116" width="285" height="108" rx="8" />
  <text class="label" x="884" y="164">签名鉴权（可选）</text>
  <text class="text" x="884" y="194">Ed25519 verify + nonce</text>

  <rect class="card" x="1210" y="116" width="260" height="108" rx="8" />
  <text class="label" x="1268" y="176">Sandbox Broker</text>

  <rect class="card" x="1544" y="116" width="220" height="108" rx="8" />
  <text class="label" x="1612" y="176">Sandbox</text>

  <path class="life" d="M208 224 V900" />
  <path class="life" d="M600 224 V900" />
  <path class="life" d="M974 224 V900" />
  <path class="life" d="M1340 224 V900" />
  <path class="life" d="M1654 224 V900" />

  <text class="step" x="250" y="286">1. 用户访问域名 / 18090</text>
  <path class="arrow" d="M208 306 H590" />

  <text class="step" x="626" y="366">2. signature 模式：Gateway 校验签名、timestamp、nonce</text>
  <path class="dash" d="M600 386 H964" />
  <path class="dash" d="M974 420 H610" />
  <text class="small" x="640" y="442">受控调用方 / ADP 持有私钥；Gateway 只保存客户端公钥</text>

  <text class="step" x="760" y="506">3. Gateway 调 Broker 创建 sandbox</text>
  <path class="arrow" d="M600 526 H1330" />

  <text class="step" x="1404" y="586">4. Broker 启动实例</text>
  <path class="arrow" d="M1340 606 H1644" />

  <text class="step" x="250" y="666">5. Gateway 返回 /xxx?token=...</text>
  <path class="arrow" d="M600 686 H218" />

  <text class="step" x="250" y="746">6. 浏览器访问专属链接（URL token）</text>
  <path class="arrow" d="M208 766 H590" />

  <text class="step" x="742" y="826">7. Gateway 校验 token / Referer 后反向代理应用请求</text>
  <path class="dash" d="M600 846 H1644" />

  <text class="step" x="805" y="906">8. release / TTL 到期后，Gateway 调 Broker terminate</text>
  <path class="dash" d="M600 926 H1330" />
</svg>
